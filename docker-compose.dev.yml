# docker-compose.dev.yml
version: '3.8'

services:
  backend:
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  
  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
  
  worker:
    volumes:
      - ./backend:/app
    command: celery -A workers.embedding worker --loglevel=info --concurrency=4 --autoreload